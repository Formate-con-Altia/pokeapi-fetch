<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
</head>

<body>
    <div class="container mb-3">
        <div class="card" style="width: 18rem;">
            <img class="card-img-top d-none" src="" alt="Card image cap" data-shiny-url="">
            <div class="card-body">
                <h5 class="card-title" style=" text-transform: capitalize;">Lorepokemon</h5>
                <a href="#" id="change-shiny" class="btn btn-success">Change to Shiny</a>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="input-group mb-3">
            <span class="input-group-text" id="selected-pokemon-label">Which pokemon do you want to display?</span>
            <select id="select-pokemon" class="form-select" aria-label="selected pokemon" aria-describedby="selected-pokemon-label">
                <option selected>Select one pokemon</option>
                <option value="pikachu">Pikachu</option>
                <option value="charmander">Charmander</option>
                <option value="luxio">Luxio</option>
            </select>
        </div>
    </div>
</body>
<script>
    // 1. Cuando cambie el valor del selector, tenemos que detectar que opción hemos escogido. Probad que sois capaces de recuperar el valor seleccionado por el usuario con un console.log
    const selectPokemon = document.querySelector('#select-pokemon');

    const btnChangeShiny = document.querySelector('#change-shiny');

    const titlePokemon = document.querySelector('.card-title');
    const imgPokemon = document.querySelector(".card-img-top");

    btnChangeShiny.addEventListener("click", function() {
        imgPokemon.src = imgPokemon.getAttribute("data-shiny-url");
    });

    selectPokemon.addEventListener("change", async function(event) {
    // 2. En función de la opción escogida, 'montaremos' una URL
    // https://pokeapi.co/api/v2/pokemon/pikachu // ruta dinámica
    // https://pokeapi.co/api/v2/pokemon/luxio

    const pokemonName = event.target.value; // me ayuda a clarificar que tipo de información contiene event.target.value

    // montar la url para ejecutar la función fetch
    const url = `https://pokeapi.co/api/v2/pokemon/${pokemonName}`;

    console.log("🚀 ~ selectPokemon.addEventListener ~ url:", url);

    const response = await fetch(url);

    const data = await response.json();
    console.log("🚀 ~ selectPokemon.addEventListener ~ data:", data)
    

    // 3. Utilizar la función fetch para hacer la llamada a esa URL
    // y procesar los datos. Significa, asignar al <h5> del DOM el nombre del pokemon que hemos recuperado de la llamada. Y en la etiqueta <img> debemos establecer el atricuto 'src' con el valor de la URL donde se ubica la imagen del pokemon
    titlePokemon.textContent = data.name;
    imgPokemon.src = data.sprites.front_default;
    imgPokemon.classList.remove("d-none");

    // 4. Nos falta habilitar la posibilidad de cambiarlo a Shiny. 

     // 4.1 Guardar el valor de data.sprites.front_shiny en el atributo data-shiny-url del tag <img>
     
     imgPokemon.setAttribute("data-shiny-url", data.sprites.front_shiny);
     // 4.2 Cuando le demos al botón "change to shiny" debemos actualizar de nuevo la propiedad .src de imgPokemon con el valor de data-shiny-url
    })



</script>

</html>
